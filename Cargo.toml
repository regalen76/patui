[package]
name = "patui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for managing Pangolin VPN accounts and connections"
license = "MIT"
repository = "https://github.com/regalen76/patui"
keywords = ["tui", "pangolin", "vpn", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[[bin]]
name = "patui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
